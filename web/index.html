<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quantum Examiner Lab</title><link rel="stylesheet" href="css/app.css"></head><body><header><h1>Quantum Examiner Lab</h1><nav><button data-page="dashboard">Dashboard</button><button data-page="simulator">Simulator</button><button data-page="examiner">Examiner</button><button data-page="devices">Devices</button><button data-page="data">Data</button><button data-page="settings">Settings</button></nav></header><main><section id="dashboard" class="page active"><h2>Command Center</h2><div class="grid"><article class="panel"><h3>Qubit Count</h3><input id="qubitCount" type="number" min="1" max="24" value="1"><button id="applyQubitCount">Apply</button></article><article class="panel"><h3>Status</h3><pre id="stateOutput"></pre></article></div></section><section id="simulator" class="page"><h2>Simulator</h2><article class="panel"><button data-gate="X">X</button><button data-gate="Y">Y</button><button data-gate="Z">Z</button><button data-gate="H">H</button><button data-gate="S">S</button><button data-gate="T">T</button><button id="reset">Reset</button><button id="measure">Measure</button><canvas id="blochCanvas" width="600" height="600"></canvas><pre id="probabilities"></pre></article></section><section id="examiner" class="page"><h2>Examiner / Tomography</h2><form id="tomographyForm" class="panel"><input name="xp" type="number" value="100"><input name="xm" type="number" value="0"><input name="yp" type="number" value="50"><input name="ym" type="number" value="50"><input name="zp" type="number" value="50"><input name="zm" type="number" value="50"><button>Examine</button><pre id="examResult"></pre></form></section><section id="devices" class="page"><h2>Electrical Device Data</h2><form id="electricalForm" class="panel"><input name="voltage" placeholder="Voltage"><input name="current" placeholder="Current"><input name="frequency" placeholder="Frequency Hz"><input name="channel" value="default"><button>Add Sample</button><pre id="deviceOutput"></pre></form></section><section id="data" class="page"><h2>Data Explorer</h2><article class="panel"><textarea id="jsonInput" rows="12">{}</textarea><button id="validateJson">Validate</button><pre id="jsonOutput"></pre></article></section><section id="settings" class="page"><h2>Settings</h2><article class="panel"><input id="apiBase" value="http://localhost:8000"><input id="maxQubits" type="number" value="24"><button id="saveSettings">Save</button></article></section></main><script src="js/app.js"></script></body></html>
